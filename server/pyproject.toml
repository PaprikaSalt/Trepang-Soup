[project]
name = "trepang-soup-server"
version = "1.5.0"
description = "Backend service for the Trepang Soup multiplayer game"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite==0.22.1",
    "alembic==1.18.5",
    "argon2-cffi==25.1.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pwdlib[argon2]==0.3.0",
    "sqlalchemy==2.0.51",
    "uvicorn==0.52.0",
    "websockets==17.0",
]

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.0",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["，", "。", "：", "？"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "tools"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false
